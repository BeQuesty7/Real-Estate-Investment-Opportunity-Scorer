version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: reios-backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: reios-frontend
    ports:
      - "8501:8501"
    depends_on:
      - backend
    volumes:
      - .:/app
    restart: unless-stopped